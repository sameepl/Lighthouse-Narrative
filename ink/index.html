<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Prototype B — Ink</title><link rel="stylesheet" href="../shared/ui.css">
<script src="vendor/ink-full.js"></script></head>
<body><div id="app"></div>
<script type="module">
import { story as data } from '../shared/story.js';
import { charMod } from '../shared/engine.js';
import { createUI } from '../shared/ui.js';
const SAVE = 'proto-ink-v2';
const ui = createUI(document.getElementById('app'), { onRestart: restart, onPick: pick });
const GRADES = ['fail', 'cost', 'clean'], LABELS = ['Failure', 'Success with a cost', 'Clean success'];
let story, ledgerSeen = 0;
const v = n => story.variablesState[n];
const isSpeech = h => /^(<[^>]+>)*[“"]/.test(h);
const parseLedger = () => v('ledger').split(';;').filter(Boolean).map(e => { const i = e.indexOf('::'); return { kind: e.slice(0, i), t: e.slice(i + 2) }; });

function tagMap(tags) { const m = {}; for (const t of tags ?? []) { const i = t.indexOf(':'); m[i < 0 ? t : t.slice(0, i)] = i < 0 ? true : t.slice(i + 1); } return m; }

function step() {
  const events = []; let oddsHtml = null;
  while (story.canContinue) {
    const text = story.Continue().trim(), tags = tagMap(story.currentTags);
    const ledger = parseLedger();                       // notes recorded before this line
    ledger.slice(ledgerSeen).forEach(n => events.push({ type: 'note', ...n }));
    ledgerSeen = ledger.length;
    if (tags.bg) ui.setBg(tags.bg);
    if (tags.odds) oddsHtml = text;
    else if (tags.roll !== undefined) {
      const g = +tags.roll;
      events.push({ type: 'roll', dice: [v('r_d1'), v('r_d2')], mod: v('cur_mod'), total: v('r_total'), grade: GRADES[g], label: LABELS[g], edge: tags.edge });
    } else if (tags.pick) events.push({ type: 'pick', html: text });
    else if (text) events.push({ type: 'para', html: text, speech: isSpeech(text) });
    if (tags.summary) events.push({ type: 'summary', items: parseLedger() });
  }
  ui.append(events);
  ui.setOdds(oddsHtml);
  refresh();
  try { localStorage.setItem(SAVE, JSON.stringify({ json: story.state.toJson(), feed: ui.getFeed() })); } catch {}
}

function refresh() {
  ui.setHud({ Credits: v('credits'), Edge: v('edge'), Strain: v('strain'), reserve: data.reserve, max: data.player.max });
  ui.setSheet({
    chars: Object.entries(data.player.chars).map(([k, s]) => ({ k, score: s, mod: charMod(s) })),
    skills: [['Leadership', v('leadership')], ['Tactics', v('tactics')], ['Persuade', v('persuade')], ['Diplomat', v('diplomat')]].map(([k, lvl]) => ({ k, lvl })),
    ledger: parseLedger(),
  });
  ui.setChoices(story.currentChoices.map(c => {
    let [text, sub] = c.text.split(' @@ ');
    const kind = text === 'Try it' ? 'try' : text === 'Odds' ? 'odds' : text === 'Back' ? 'back'
      : text.startsWith('Spend Edge') ? 'edge' : text === 'Accept the result' ? 'accept' : 'choice';
    const m = text.match(/^(.*) \((\d+ left)\)$/); if (m) { text = m[1]; sub = m[2]; }
    return { id: c.index, kind, text, sub };
  }));
}

function pick(i) { story.ChooseChoiceIndex(i); step(); }

async function boot(saved) {
  const src = await (await fetch('story.ink')).text();
  const errs = [];
  story = new inkjs.Compiler(src, new inkjs.CompilerOptions(null, [], false, (m, t) => errs.push(m))).Compile();
  if (errs.length) console.error('ink compile:', errs.join('\n'));
  ui.clear(); ledgerSeen = 0;
  if (saved) { story.state.LoadJson(saved.json); ui.setFeed(saved.feed); ledgerSeen = parseLedger().length; refresh(); }
  else step();
}
function restart() { try { localStorage.removeItem(SAVE); } catch {} boot(null); }
let saved = null; try { saved = JSON.parse(localStorage.getItem(SAVE)); } catch {}
boot(saved).catch(e => { console.error(e); restart(); });
</script></body></html>
